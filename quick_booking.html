<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز جلسة متابعة</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:20px;color:#222}
.card{max-width:520px;margin:20px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
label{display:block;text-align:right;margin-top:16px;font-weight:bold}
select,input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{background:#1976d2;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{background:#aaa}
.slot{padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:10px;cursor:pointer}
.slot.booked{background:#eee;color:#888;cursor:not-allowed}
.message{margin-top:15px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
<h1>🔄 حجز جلسة متابعة</h1>
<p>اختر اليوم والوقت المتاح. المواعيد مأخوذة مباشرة من جدول المواعيد المشترك.</p>

<label>التاريخ</label>
<select id="date"><option value="">اختر التاريخ</option></select>

<label>الوقت</label>
<div id="slots">اختر التاريخ أولًا</div>

<label>الاسم</label>
<input id="name" type="text" placeholder="اكتب الاسم">

<button id="confirm" disabled>تأكيد الموعد وإرسال الطلب عبر WhatsApp</button>
<div id="message" class="message"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxv8WdSFiM9lOEDASGrOYvEA3YQroksPYP1iWNLS2g8C5vuIaq1NP6dPKBHP45aswRu/exec";
let selectedTime = "";

function show(msg){ document.getElementById("message").textContent = msg; }

async function getJSON(url){
  const res = await fetch(url, {cache:"no-store"});
  return await res.json();
}

async function loadDays(){
  try{
    const data = await getJSON(API_URL + "?action=availability&t=" + Date.now());
    const select = document.getElementById("date");
    if(!data.success){ show("تعذر تحميل المواعيد."); return; }
    data.days.forEach(d=>{
      const o=document.createElement("option");
      o.value=d.date; o.textContent=d.label;
      select.appendChild(o);
    });
  }catch(e){ show("تعذر الاتصال بنظام المواعيد."); }
}

async function loadSlots(date){
  selectedTime="";
  document.getElementById("confirm").disabled=true;
  const box=document.getElementById("slots");
  box.textContent="جاري تحميل الأوقات...";
  try{
    const data=await getJSON(API_URL+"?action=slots&date="+encodeURIComponent(date)+"&t="+Date.now());
    box.innerHTML="";
    if(!data.success || !data.slots.length){ box.textContent="لا توجد مواعيد لهذا اليوم."; return; }
    data.slots.forEach(s=>{
      const div=document.createElement("div");
      div.className="slot"+(s.booked?" booked":"");
      div.textContent=s.booked ? s.time+" — محجوز" : s.time;
      if(!s.booked){
        div.onclick=()=>{
          document.querySelectorAll(".slot").forEach(x=>x.style.outline="");
          div.style.outline="2px solid #1976d2";
          selectedTime=s.time;
          document.getElementById("confirm").disabled=false;
        };
      }
      box.appendChild(div);
    });
  }catch(e){ box.textContent="تعذر تحميل الأوقات."; }
}

document.getElementById("date").addEventListener("change", e=>{
  if(e.target.value) loadSlots(e.target.value);
});
document.getElementById("confirm").addEventListener("click", async ()=>{
  const date=document.getElementById("date").value;
  const name=document.getElementById("name").value.trim();
  if(!date || !selectedTime || !name){ show("أكمل التاريخ والوقت والاسم."); return; }

  const btn=document.getElementById("confirm");
  btn.disabled=true; show("جاري تثبيت الموعد...");
  try{
    const data=await getJSON(API_URL+"?action=reserve&date="+encodeURIComponent(date)+"&time="+encodeURIComponent(selectedTime)+"&t="+Date.now());
    if(!data.success){
      show(data.message || "لم يتم تثبيت الموعد.");
      await loadSlots(date);
      return;
    }
    const text=`حجز جلسة متابعة%0Aالاسم: ${encodeURIComponent(name)}%0Aالتاريخ: ${encodeURIComponent(date)}%0Aالوقت: ${encodeURIComponent(selectedTime)}`;
    window.location.href="https://wa.me/?text="+text;
  }catch(e){
    show("حدث خطأ أثناء تثبيت الموعد.");
    btn.disabled=false;
  }
});
loadDays();
</script>
</body>
</html>
