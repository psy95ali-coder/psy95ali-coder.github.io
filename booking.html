<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجز أول جلسة</title><style>*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#222}
.wrap{max-width:720px;margin:auto;padding:22px}
.card{background:#fff;border-radius:20px;padding:26px;margin:18px 0;box-shadow:0 5px 22px rgba(0,0,0,.08)}
.hero{text-align:center}
img{width:170px;height:170px;object-fit:cover;border-radius:50%;box-shadow:0 4px 15px rgba(0,0,0,.15)}
h1{text-align:center;font-size:30px;margin:16px 0 8px}
h2{text-align:center}
.sub{text-align:center;line-height:1.9;color:#555}
label{display:block;margin-top:14px;font-weight:bold}
input,select,textarea{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #ccc;border-radius:11px;font-size:16px;background:#fff}
textarea{min-height:100px;resize:vertical}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:13px;text-align:center;text-decoration:none;font-size:18px;font-weight:bold;margin-top:12px;cursor:pointer}
.first{background:#e8f5e9;color:#1b5e20}.follow{background:#e3f2fd;color:#0d47a1}.main{background:#1976d2;color:#fff}
.back{display:inline-block;text-decoration:none;color:#1976d2;font-weight:bold;margin-bottom:14px}
.note{margin-top:18px;padding:15px;background:#fff7df;border-radius:12px;line-height:1.9}
.check{display:flex!important;align-items:center;gap:10px;font-weight:normal!important;cursor:pointer}
.check input{width:20px;height:20px;margin:0}
.price{text-align:center;font-weight:bold;line-height:2;margin-top:14px}
.msg{text-align:center;margin-top:12px;line-height:1.8}
ul{line-height:2}</style></head><body><div class="wrap"><div class="card"><a class="back" href="index.html">← العودة للصفحة الرئيسية</a><h1>🆕 حجز أول جلسة</h1><p class="sub">اختر التاريخ والوقت الذي يناسبك. <strong>الوقت المقترح لا يعني تثبيت الموعد</strong>؛ يتم تأكيده بعد مراجعة الطلب.</p><label>نوع الجلسة</label><select id="type" onchange="toggleLocation()"><option value="online">أونلاين</option><option value="inperson">حضوري</option><option value="home">زيارة منزلية</option></select><div id="locationBox" style="display:none"><label>مكان الجلسة الحضورية</label><select id="location"><option>الياقوت</option><option>الوردة</option><option>فود لاند</option><option>بوليفارد</option><option>بن أكبر</option><option>مختار</option></select></div><label>التاريخ المطلوب</label><input id="date" type="date"><label>الوقت المطلوب</label><input id="time" type="time"><label>الاسم الثلاثي</label><input id="name" placeholder="الاسم الثلاثي"><label>العمر</label><input id="age" type="number" min="1" max="120" placeholder="العمر"><label>السكن</label><input id="residence" placeholder="المحافظة / المدينة"><label>التحصيل الدراسي</label><input id="education" placeholder="التحصيل الدراسي"><label>الحالة الاجتماعية</label><select id="marital"><option value="">اختر</option><option>أعزب/عزباء</option><option>متزوج/متزوجة</option><option>مطلق/مطلقة</option><option>أرمل/أرملة</option></select><label>العمل الحالي</label><input id="job" placeholder="العمل الحالي"><label>المشكلة النفسية / سبب المراجعة</label><textarea id="reason" placeholder="اكتب باختصار سبب طلب الجلسة"></textarea><div class="note"><strong>أسعار الجلسات:</strong><br>• أونلاين: <strong>25,000 د.ع</strong><br>• حضوري: <strong>25,000 د.ع</strong><br>• زيارة منزلية: <strong>50,000 د.ع</strong><br><br><label class="check"><input id="paid" type="checkbox"> أؤكد أنني قمت بدفع أجور الجلسة مسبقًا.</label></div><button class="btn main" onclick="sendBooking()">إرسال طلب الحجز عبر واتساب</button><div id="msg" class="msg"></div></div></div><script>function toggleLocation(){document.getElementById('locationBox').style.display=document.getElementById('type').value==='inperson'?'block':'none';}function sendBooking(){if(!document.getElementById('paid').checked){document.getElementById('msg').textContent='يرجى تأكيد إتمام الدفع قبل إرسال طلب الحجز.';return;}var n=document.getElementById('name').value.trim(),d=document.getElementById('date').value,t=document.getElementById('time').value,a=document.getElementById('age').value.trim(),r=document.getElementById('residence').value.trim(),reason=document.getElementById('reason').value.trim();if(!n||!d||!t||!a||!r||!reason){document.getElementById('msg').textContent='يرجى إكمال المعلومات الأساسية والتاريخ والوقت.';return;}var type=document.getElementById('type').value;var text='حجز أول جلسة\nالاسم: '+n+'\nالعمر: '+a+'\nالسكن: '+r+'\nالتحصيل الدراسي: '+document.getElementById('education').value+'\nالحالة الاجتماعية: '+document.getElementById('marital').value+'\nالعمل: '+document.getElementById('job').value+'\nسبب المراجعة: '+reason+'\nالتاريخ المطلوب: '+d+'\nالوقت المطلوب: '+t+'\nنوع الجلسة: '+(type==='online'?'أونلاين':type==='inperson'?'حضوري':'زيارة منزلية');if(type==='inperson')text+='\nالمكان: '+document.getElementById('location').value;text+='\n\nملاحظة: هذا طلب حجز والموعد يحتاج تأكيد.';location.href='https://wa.me/9647811627604?text='+encodeURIComponent(text);}</script></body></html>
